<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOOD LOG</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080f1e; font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; color: #e2e8f0; }
    button { font-family: inherit; }
    textarea { font-family: inherit; }
    input { font-family: inherit; }
    @keyframes bounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(0.93); }
      100% { transform: scale(1); }
    }
    .bounce {
      animation: bounce 0.3s ease;
      -webkit-animation: bounce 0.3s ease;
    }
    @-webkit-keyframes bounce {
      0%   { -webkit-transform: scale(1); }
      40%  { -webkit-transform: scale(0.93); }
      100% { -webkit-transform: scale(1); }
    }
    input[type="datetime-local"] { color-scheme: dark; }

    /* Layout */
    #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 60px; }
    #main { width: 100%; max-width: 480px; padding: 32px 20px 0; }

    /* Header */
    .header-title { font-size: 22px; font-weight: 800; letter-spacing: 0.1em; color: #f1f5f9; margin-bottom: 4px; }
    .header-line { height: 2px; background: linear-gradient(90deg,#6366f1,#06b6d4,transparent); border-radius: 2px; margin-bottom: 24px; }

    /* Nav */
    .nav { display: flex; gap: 8px; margin-bottom: 28px; }
    .nav button { flex: 1; padding: 8px 0; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.15s; }
    .nav button.active { background: #3b4fd8; color: #fff; }
    .nav button.inactive { background: #1e293b; color: #64748b; }

    /* Mood buttons */
    .mood-btn { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; cursor: pointer; text-align: left; transition: all 0.15s; width: 100%; margin-bottom: 8px; }
    .mood-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Record button */
    .record-btn { width: 100%; padding: 14px 0; border-radius: 12px; border: none; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }

    /* Graph */
    .graph-wrap { background: #0d1829; border-radius: 16px; padding: 16px 8px; border: 1px solid #1e293b; }
    svg.chart { width: 100%; display: block; }
    .tooltip { position: absolute; background: #1e293b; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #e2e8f0; pointer-events: none; display: none; z-index: 10; }

    /* Cards */
    .card { background: #0d1829; border: 1px solid #1e293b; border-radius: 10px; padding: 12px 14px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
    .stat-card { background: #0d1829; border-radius: 10px; padding: 12px 8px; text-align: center; border: 1px solid #1e293b; }
    .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }

    /* History */
    .history-item { background: #0d1829; border: 1px solid #1e293b; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-box { background: #131d30; border: 1px solid #253347; border-radius: 16px; padding: 28px 24px; width: 300px; text-align: center; box-shadow: 0 24px 64px rgba(0,0,0,0.8); }

    /* Note toggle */
    .note-toggle { background: none; border: 1px dashed #334155; border-radius: 10px; color: #475569; font-size: 13px; padding: 10px 14px; cursor: pointer; width: 100%; text-align: left; }
    .label { font-size: 12px; color: #475569; letter-spacing: 1px; margin-bottom: 8px; }
    textarea.note { width: 100%; min-height: 80px; background: #131d30; border: 1px solid #1e293b; border-radius: 10px; color: #e2e8f0; font-size: 16px; padding: 10px 12px; resize: vertical; outline: none; }
  </style>
</head>
<body>
<div id="app">
  <div id="main">
    <div class="header-title">MOOD LOG</div>
    <div class="header-line"></div>
    <div class="nav" id="nav"></div>
    <div id="view-content"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const STORAGE_KEY = "bipolar-mood-log";

const MOOD_LEVELS = [
  { value: 5,  label: "躁状態",   emoji: "⚡", color: "#f59e0b", desc: "とても高揚・多弁・衝動的" },
  { value: 4,  label: "軽躁",     emoji: "☀️", color: "#fbbf24", desc: "エネルギー高め・良い気分" },
  { value: 3,  label: "やや高め", emoji: "🌤", color: "#a3e635", desc: "少し活発・前向き" },
  { value: 2,  label: "混合",     emoji: "⛅", color: "#60a5fa", desc: "躁と鬱が混在している" },
  { value: 1,  label: "やや低め", emoji: "🌧", color: "#818cf8", desc: "少し憂鬱・疲れ気味" },
  { value: 0,  label: "軽い鬱",   emoji: "🌩", color: "#7c3aed", desc: "気力低下・沈んでいる" },
  { value: -1, label: "鬱状態",   emoji: "🌑", color: "#4c1d95", desc: "強い絶望感・動けない" },
];
const MOOD_MAP = Object.fromEntries(MOOD_LEVELS.map(m => [m.value, m]));

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function formatDateTime(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function getNow() {
  const d = new Date();
  d.setSeconds(0, 0);
  const offset = d.getTimezoneOffset() * 60000;
  return new Date(d - offset).toISOString().slice(0, 16);
}
function toScale(v) { return (((v + 1) / 6) * 9 + 1).toFixed(1); }

// State
let state = {
  logs: [],
  view: "record",
  selected: 2,
  note: "",
  customDate: getNow(),
  showNote: false,
  period: 30,
  confirmIdx: null,
  saved: false,
};

try { const r = localStorage.getItem(STORAGE_KEY); if (r) state.logs = JSON.parse(r); } catch {}

function saveLogs(logs) {
  state.logs = logs;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
}

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ---- RENDER ----
function render() {
  renderNav();
  renderView();
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  [["record","記録する"],["graph","グラフ"],["history","履歴"]].forEach(([key, label]) => {
    const btn = document.createElement("button");
    btn.textContent = label;
    btn.className = state.view === key ? "active" : "inactive";
    btn.onclick = () => setState({ view: key });
    nav.appendChild(btn);
  });
}

function renderView() {
  const el = document.getElementById("view-content");
  if (state.view === "record") el.innerHTML = renderRecord();
  else if (state.view === "graph") el.innerHTML = renderGraph();
  else el.innerHTML = renderHistory();
  bindEvents();
  if (state.view === "graph") drawChart();
}

function renderRecord() {
  const mood = MOOD_MAP[state.selected];
  const grad = `linear-gradient(135deg, ${mood?.color || "#6366f1"}, #3b4fd8)`;
  const shadow = `0 4px 20px ${mood?.color || "#6366f1"}44`;

  let moodBtns = MOOD_LEVELS.map(m => {
    const active = state.selected === m.value;
    return `<button class="mood-btn" data-mood="${m.value}" style="
      border: 2px solid ${active ? m.color : "transparent"};
      background: ${active ? m.color+"18" : "#131d30"};
      box-shadow: ${active ? `0 0 16px ${m.color}33` : "none"};
    ">
      <span style="font-size:20px;width:28px;text-align:center">${m.emoji}</span>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:700;color:${active ? m.color : "#cbd5e1"}">${m.label}</div>
        <div style="font-size:11px;color:#64748b;margin-top:1px">${m.desc}</div>
      </div>
      ${active ? `<span class="mood-dot" style="background:${m.color}"></span>` : ""}
    </button>`;
  }).join("");

  const noteArea = state.showNote
    ? `<div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div class="label">メモ</div>
          <button id="close-note" style="background:none;border:none;color:#475569;font-size:12px;cursor:pointer">✕ 閉じる</button>
        </div>
        <textarea class="note" id="note-input" placeholder="今の状況・出来事・気づきなど…">${state.note}</textarea>
      </div>`
    : `<button class="note-toggle" id="open-note">＋ メモを追加</button>`;

  return `
    <div style="margin-bottom:20px">
      <div class="label">今の気分は？</div>
      ${moodBtns}
    </div>
    <div style="margin-bottom:20px">
      <div class="label">日時</div>
      <div style="width:100%;background:#131d30;border:1px solid #1e293b;border-radius:10px;overflow:hidden;position:relative;height:44px;display:flex;align-items:center;justify-content:center">
        <input type="datetime-local" id="date-input" value="${state.customDate}" style="position:absolute;top:0;left:0;width:100%;height:100%;background:transparent;border:none;color:#e2e8f0;font-size:14px;font-weight:600;padding:0 12px;outline:none;text-align:center" />
      </div>
    </div>
    <div style="margin-bottom:20px">${noteArea}</div>
    <button id="record-btn" style="width:100%;padding:14px 0;border-radius:12px;border:none;background:${grad};color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:${shadow}">
      ${state.saved ? "✓ 記録しました" : "記録する"}
    </button>
    ${renderModal()}
  `;
}

function renderModal() {
  if (state.confirmIdx === null) return "";
  const log = state.logs[state.confirmIdx];
  const mood = log ? MOOD_MAP[log.mood] : null;
  return `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box" id="modal-box">
        <div style="font-size:30px;margin-bottom:10px">🗑️</div>
        <div style="font-size:15px;font-weight:700;color:#f1f5f9;margin-bottom:6px">この記録を削除しますか？</div>
        <div style="font-size:12px;color:#64748b;margin-bottom:18px">削除すると元に戻せません</div>
        ${log ? `<div style="background:#0d1829;border-radius:10px;padding:10px 14px;margin-bottom:22px;border-left:3px solid ${mood?.color||"#6366f1"};text-align:left">
          <div style="font-size:13px;color:${mood?.color};font-weight:600">${mood?.emoji} ${mood?.label}</div>
          <div style="font-size:11px;color:#64748b;margin-top:2px">${formatDateTime(log.date)}</div>
          ${log.note ? `<div style="font-size:12px;color:#94a3b8;margin-top:4px;word-break:break-all">${log.note}</div>` : ""}
        </div>` : ""}
        <div style="display:flex;gap:10px">
          <button id="cancel-delete" style="flex:1;padding:11px 0;border-radius:10px;border:1px solid #334155;background:none;color:#94a3b8;font-size:13px;font-weight:600;cursor:pointer">キャンセル</button>
          <button id="confirm-delete" style="flex:1;padding:11px 0;border-radius:10px;border:none;background:#7f1d1d;color:#fca5a5;font-size:13px;font-weight:700;cursor:pointer">削除する</button>
        </div>
      </div>
    </div>`;
}

function renderGraph() {
  const chartData = getChartData();
  if (state.logs.length < 2) {
    return `<div style="text-align:center;color:#475569;padding:60px 0;font-size:14px">記録が2件以上たまるとグラフが表示されます</div>`;
  }

  const periodBtns = [[30,"30日"],[90,"90日"],[null,"全期間"]].map(([val, label]) => {
    const active = state.period === val;
    return `<button data-period="${val}" style="padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:${active?"#3b4fd8":"#1e293b"};color:${active?"#fff":"#64748b"};transition:all 0.15s">${label}</button>`;
  }).join("");

  const legendItems = MOOD_LEVELS.map(m =>
    `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0d1829;border-radius:8px">
      <span style="font-size:16px">${m.emoji}</span>
      <span style="font-size:11px;color:${m.color};font-weight:600">${m.label}</span>
    </div>`
  ).join("");

  let statsHtml = "";
  if (state.logs.length >= 3) {
    const rawAvg = state.logs.reduce((s,l) => s + l.mood, 0) / state.logs.length;
    const avg = toScale(rawAvg);
    const max = Math.max(...state.logs.map(l => l.mood));
    const min = Math.min(...state.logs.map(l => l.mood));

    const now = new Date();
    const thisWeekStart = new Date(now); thisWeekStart.setDate(now.getDate() - 7);
    const lastWeekStart = new Date(now); lastWeekStart.setDate(now.getDate() - 14);
    const thisW = state.logs.filter(l => new Date(l.date) >= thisWeekStart);
    const lastW = state.logs.filter(l => new Date(l.date) >= lastWeekStart && new Date(l.date) < thisWeekStart);
    let patternMsg = "", patternColor = "#475569";
    if (thisW.length >= 2) {
      const thisAvg = thisW.reduce((s,l) => s + l.mood, 0) / thisW.length;
      const spread = Math.max(...thisW.map(l=>l.mood)) - Math.min(...thisW.map(l=>l.mood));
      if (spread >= 4) { patternMsg = "今週は波が大きめです"; patternColor = "#f59e0b"; }
      else if (lastW.length >= 2) {
        const lastAvg = lastW.reduce((s,l) => s + l.mood, 0) / lastW.length;
        const diff = thisAvg - lastAvg;
        if (diff <= -0.8) { patternMsg = "先週より気分が低めです"; patternColor = "#818cf8"; }
        else if (diff >= 0.8) { patternMsg = "先週より気分が高めです"; patternColor = "#fbbf24"; }
        else { patternMsg = "今週は比較的に安定しています"; patternColor = "#60a5fa"; }
      }
    }

    statsHtml = `
      ${patternMsg ? `<div style="margin-top:16px;padding:10px 14px;border-radius:10px;background:#0d1829;border:1px solid ${patternColor}44;font-size:13px;font-weight:600;color:${patternColor};text-align:center">${patternMsg}</div>` : ""}
      <div class="stat-grid">
        <div class="stat-card"><div style="font-size:10px;color:#475569;margin-bottom:4px">平均</div><div style="font-size:13px;font-weight:700;color:#6366f1">${avg} / 10</div></div>
        <div class="stat-card"><div style="font-size:10px;color:#475569;margin-bottom:4px">最高</div><div style="font-size:13px;font-weight:700;color:${MOOD_MAP[max]?.color}">${MOOD_MAP[max]?.emoji} ${MOOD_MAP[max]?.label}</div></div>
        <div class="stat-card"><div style="font-size:10px;color:#475569;margin-bottom:4px">最低</div><div style="font-size:13px;font-weight:700;color:${MOOD_MAP[min]?.color}">${MOOD_MAP[min]?.emoji} ${MOOD_MAP[min]?.label}</div></div>
      </div>`;
  }

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:12px;color:#475569;letter-spacing:1px">気分の波（${chartData.length}件）</div>
      <div style="display:flex;gap:6px">${periodBtns}</div>
    </div>
    <div class="graph-wrap">
      <svg class="chart" id="chart" height="240"></svg>
    </div>
    <div class="legend-grid">${legendItems}</div>
    ${statsHtml}`;
}

function getChartData() {
  if (state.period === null) return state.logs;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - state.period);
  return state.logs.filter(l => new Date(l.date) >= cutoff);
}

function drawChart() {
  const svg = document.getElementById("chart");
  if (!svg) return;
  const data = getChartData();
  if (data.length < 2) return;

  const W = svg.parentElement.clientWidth - 16;
  const H = 240;
  const padL = 28, padR = 16, padT = 12, padB = 24;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W);

  const minV = -1, maxV = 5;
  const xScale = (i) => padL + (i / (data.length - 1)) * innerW;
  const yScale = (v) => padT + ((maxV - v) / (maxV - minV)) * innerH;

  let html = `<defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="33%" stop-color="#60a5fa"/>
      <stop offset="66%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>`;

  // Grid lines
  [-1,0,1,2,3,4,5].forEach(v => {
    const y = yScale(v);
    const dash = v === 2 ? "4,4" : "";
    html += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#1e293b" stroke-dasharray="${dash}" />`;
    const mood = MOOD_MAP[v];
    if (mood) html += `<text x="${padL-4}" y="${y+4}" text-anchor="end" font-size="11" fill="#475569">${mood.emoji}</text>`;
  });

  // X axis labels
  const step = Math.ceil(data.length / 6);
  data.forEach((d, i) => {
    if (i % step === 0 || i === data.length - 1) {
      html += `<text x="${xScale(i)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#475569">${formatDate(d.date)}</text>`;
    }
  });

  // Line path
  const points = data.map((d, i) => `${xScale(i)},${yScale(d.mood)}`);
  html += `<polyline points="${points.join(" ")}" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;

  // Dots
  data.forEach((d, i) => {
    const mood = MOOD_MAP[d.mood];
    const x = xScale(i), y = yScale(d.mood);
    html += `<circle cx="${x}" cy="${y}" r="5" fill="${mood?.color||"#6366f1"}" stroke="#0f172a" stroke-width="2" data-idx="${i}" class="chart-dot" style="cursor:pointer"/>`;
  });

  svg.innerHTML = html;

  // Tooltip
  const tooltip = document.getElementById("tooltip");
  svg.querySelectorAll(".chart-dot").forEach(dot => {
    dot.addEventListener("mouseenter", (e) => {
      const i = parseInt(dot.dataset.idx);
      const d = data[i];
      const mood = MOOD_MAP[d.mood];
      tooltip.innerHTML = `<div style="font-weight:700;margin-bottom:4px">${formatDateTime(d.date)}</div><div style="color:${mood?.color}">${mood?.emoji} ${mood?.label}</div>${d.note?`<div style="margin-top:6px;color:#94a3b8;max-width:200px">${d.note}</div>`:""}`;
      tooltip.style.display = "block";
      tooltip.style.borderColor = mood?.color || "#334155";
    });
    dot.addEventListener("mousemove", (e) => {
      tooltip.style.left = (e.pageX + 12) + "px";
      tooltip.style.top = (e.pageY - 20) + "px";
    });
    dot.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
  });
}

function renderHistory() {
  const modal = renderHistoryModal();
  if (state.logs.length === 0) {
    return `<div style="font-size:12px;color:#475569;margin-bottom:16px;letter-spacing:1px">記録履歴（0件）</div>
    <div style="text-align:center;color:#475569;padding:60px 0;font-size:14px">まだ記録がありません</div>${modal}`;
  }
  const items = [...state.logs].reverse().map((log, i) => {
    const mood = MOOD_MAP[log.mood];
    const realIdx = state.logs.length - 1 - i;
    return `<div class="history-item" style="border-left:3px solid ${mood?.color||"#6366f1"}">
      <span style="font-size:22px;flex-shrink:0">${mood?.emoji}</span>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:700;color:${mood?.color}">${mood?.label}</span>
          <span style="font-size:14px;color:#94a3b8;font-weight:600">${formatDateTime(log.date)}</span>
        </div>
        ${log.note ? `<div style="font-size:12px;color:#94a3b8;margin-top:4px;word-break:break-all">${log.note}</div>` : ""}
      </div>
      <button data-del="${realIdx}" style="background:none;border:none;color:#334155;cursor:pointer;font-size:16px;padding:4px;flex-shrink:0">✕</button>
    </div>`;
  }).join("");
  return `<div style="font-size:12px;color:#475569;margin-bottom:16px;letter-spacing:1px">記録履歴（${state.logs.length}件）</div>${items}${modal}`;
}

function renderHistoryModal() {
  if (state.confirmIdx === null) return "";
  return renderModal();
}

function bindEvents() {
  // Nav mood buttons
  document.querySelectorAll("[data-mood]").forEach(btn => {
    btn.onclick = () => setState({ selected: parseInt(btn.dataset.mood) });
  });

  // Date input
  const dateInput = document.getElementById("date-input");
  if (dateInput) dateInput.onchange = (e) => { state.customDate = e.target.value; };

  // Note
  const openNote = document.getElementById("open-note");
  if (openNote) openNote.onclick = () => setState({ showNote: true });
  const closeNote = document.getElementById("close-note");
  if (closeNote) closeNote.onclick = () => setState({ showNote: false, note: "" });
  const noteInput = document.getElementById("note-input");
  if (noteInput) noteInput.oninput = (e) => { state.note = e.target.value; };

  // Record button
  const recordBtn = document.getElementById("record-btn");
  if (recordBtn) {
    recordBtn.onclick = () => {
      recordBtn.style.transform = "scale(0.93)";
      recordBtn.style.transition = "transform 0.15s ease";
      setTimeout(() => {
        recordBtn.style.transform = "scale(1)";
      }, 150);
      const date = new Date(state.customDate).toISOString();
      const entry = { date, mood: state.selected, note: state.note };
      const newLogs = [...state.logs, entry].sort((a,b) => new Date(a.date) - new Date(b.date));
      saveLogs(newLogs);
      state.note = "";
      state.customDate = getNow();
      state.showNote = false;
      state.saved = true;
      render();
      setTimeout(() => { state.saved = false; render(); }, 2000);
    };
  }

  // Period buttons
  document.querySelectorAll("[data-period]").forEach(btn => {
    btn.onclick = () => {
      const val = btn.dataset.period;
      setState({ period: val === "null" ? null : parseInt(val) });
    };
  });

  // Delete buttons
  document.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = () => setState({ confirmIdx: parseInt(btn.dataset.del) });
  });

  // Modal
  const overlay = document.getElementById("modal-overlay");
  if (overlay) overlay.onclick = () => setState({ confirmIdx: null });
  const modalBox = document.getElementById("modal-box");
  if (modalBox) modalBox.onclick = (e) => e.stopPropagation();
  const cancelBtn = document.getElementById("cancel-delete");
  if (cancelBtn) cancelBtn.onclick = () => setState({ confirmIdx: null });
  const confirmBtn = document.getElementById("confirm-delete");
  if (confirmBtn) confirmBtn.onclick = () => {
    saveLogs(state.logs.filter((_, i) => i !== state.confirmIdx));
    setState({ confirmIdx: null });
  };
}

render();
</script>
</body>
</html>
